<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Моя первая страница</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }
      main {
        max-width: 560px;
        padding: 48px 40px;
        background: #1e293b;
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 40px;
        color: #38bdf8;
      }
      p {
        margin: 16px 0 0;
        line-height: 1.65;
        font-size: 16px;
        color: #cbd5e1;
      }
      .accent { color: #facc15; }
    </style>
  </head>
  <body>
    <main>
      <h1>Привет, я tarnu! 👋</h1>
      <p>
        Это моя первая веб-страница: я учусь <span class="accent">веб-разработке</span> —
        html, css и javascript, и постепенно собираю свои первые проекты.
      </p>
      <p>
        Эту страницу я создал сам и положил в git-репозиторий, а дальше хочу
        разобраться со сборкой, React и дизайном интерфейсов. Следите за прогрессом!
      </p>
    </main>
  </body>
</html>
